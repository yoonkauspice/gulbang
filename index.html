<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글방">
<meta name="theme-color" content="#f4ecd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>진윤이의 글방</title>
<style>
:root{--bg:#fbf6ec;--ink:#2b2b3a;--sub:#6b6b7b;--accent:#c8553d;--blue:#3d6b8c;--card:#fff;--line:#e6dcc8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:28px;margin:6px 0 14px}
h2{font-size:18px;margin:0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 22px}
.big button{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 10px;font-size:40px;display:flex;flex-direction:column;align-items:center;gap:6px}
.big button b{font-size:19px}
.big button:active{transform:scale(.98);border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.ghost{border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--card);font-size:15px}
.primary{background:var(--accent);color:#fff;border-radius:14px;padding:12px 20px;font-size:17px;font-weight:600}
.list{list-style:none;padding:0;margin:10px 0}
.list li{display:flex;gap:8px;margin-bottom:10px}
.item{flex:1;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.item .ic{font-size:28px}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--sub);margin-top:2px}
.del{width:46px;border-radius:12px;font-size:18px;opacity:.55}
.banner{background:#fff3d6;border:1.5px solid #ecd28a;border-radius:14px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
header.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#saved{font-size:13px;color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.bubble{display:flex;gap:10px;background:#eef4f8;border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.bubble .ic{font-size:26px}
.bubble p{margin:2px 0 0;font-size:17px}
.bubble small{color:var(--sub)}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.toggle button{padding:9px 18px;font-size:16px}
.toggle button.on{background:var(--ink);color:#fff}
textarea.body{width:100%;min-height:46vh;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:20px;line-height:1.7;background:var(--card);resize:vertical}
label.f{display:block;margin:0 0 14px;font-size:15px;color:var(--sub)}
label.f input{display:block;width:100%;margin-top:5px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:18px;background:var(--card);color:var(--ink)}
.stars button{font-size:34px;color:#d9ccb0;padding:0 3px}.stars button.on{color:#f0b429}
.pick button{font-size:32px;padding:6px 10px;border-radius:12px;border:2px solid transparent}
.pick button.on{border-color:var(--accent);background:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tools button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:15px}
.tools button.on{border-color:var(--ink);background:#f1ead8}
.dot{width:26px;height:26px;border-radius:50%;padding:0!important;border:3px solid #fff!important;box-shadow:0 0 0 1.5px var(--line)}
.dot.on{box-shadow:0 0 0 3px var(--ink)}
.pg{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;line-height:0}
canvas{display:block;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0;font-size:15px}
details{margin-top:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
details textarea{width:100%;min-height:90px;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
footer.nav{display:flex;justify-content:space-between;margin-top:18px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h2{margin-bottom:10px}
.card .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
select{font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;width:100%;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:16px;z-index:9}
.designer{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;align-items:start}
@media (max-width:700px){.designer{grid-template-columns:1fr}}
.stagebox{background:#f3ead7;border-radius:18px;padding:0;overflow:hidden;line-height:0;border:1.5px solid #cdbf9d}
.stagebox svg{display:block;width:100%;height:auto;max-height:72vh;margin:0 auto}
.stagebox canvas{display:block;width:100%;height:auto}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ptab{padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
.ptab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.opts button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;font-size:16px}
.opts button.on{border-color:var(--ink);background:#f1ead8;font-weight:600}
.opts .sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.opts .sw.on{box-shadow:0 0 0 3.5px var(--ink)}
.lbl{font-size:14px;color:var(--sub);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:12px 0}
.oc{background:#f6efdc;border:1.5px solid #cdbf9d;border-radius:16px;padding:3px 3px 8px;text-align:center;color:#3a2a22}
.oc svg,.oc img,.oimg{display:block;width:100%;height:auto;border-radius:12px}
.oc .t{font-size:14px;font-weight:600;margin-top:4px}
.oc.new{background:var(--card);border-color:var(--line);border-style:dashed;color:var(--sub);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;min-height:150px}
.ver{margin-top:30px;text-align:center;font-size:12px;color:var(--sub)}
#print{display:none}
@media print{
 #app,.toast{display:none!important}
 #print{display:block}
 body{background:#fff}
 .pe{page-break-before:always;font-size:14pt;line-height:1.7}
 .pe:first-child{page-break-before:auto}
 .pe h1{font-size:22pt;margin:0 0 4pt}
 .pe .meta{color:#666;font-size:11pt;margin-bottom:12pt}
 .pe h3{font-size:14pt;margin:14pt 0 4pt;color:#3d6b8c}
 .pe img{width:100%;border:1px solid #ccc;margin:4pt 0;page-break-inside:avoid}
}

/* ===== v0.6 디자인: 1920년대 패션 플레이트 분위기 ===== */
:root{--bg:#f4ecd8;--ink:#3a2a22;--sub:#8a7461;--accent:#c4685c;--blue:#7a9bb5;--sage:#8fae9a;--card:#fbf6e8;--line:#d8c7a5;--serif:'AppleMyungjo','Nanum Myeongjo','Noto Serif KR','Batang',serif}
html,body{background-color:var(--bg);background-image:linear-gradient(rgba(244,236,216,.45),rgba(244,236,216,.45)),url(bg-paper.webp);background-size:auto,cover;background-attachment:scroll,fixed;color:var(--ink)}
h1,h2,.t,.ptab,.big button b{font-family:var(--serif)}
h1{font-size:30px;letter-spacing:-.5px}
.hero{display:flex;align-items:center;gap:18px;margin:4px 0 14px}
.hero canvas{width:112px;height:auto;aspect-ratio:800/1192;border-radius:14px;border:1.5px solid var(--line);box-shadow:0 0 0 4px var(--card),0 0 0 5px var(--line);flex:none}
.hero h1{margin:0 0 4px}.hero .tag{margin:0;color:var(--sub);font-size:16px;line-height:1.5;font-family:var(--serif)}
.orn{color:var(--accent);font-size:22px;margin-top:6px}
.big button,.card,.item,.banner,details,textarea.body,.pg,.bubble{box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.big button{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:26px 10px}
.big button:active{border-color:var(--accent)}
.item,.card,.pg,details,textarea.body{background:var(--card)}
.item{border-radius:16px;padding:14px 16px}
.bubble{background:#ece9d9;border-radius:16px;padding:14px 16px}
.ghost{background:var(--card);border-color:var(--line);border-radius:999px;padding:9px 16px}
.primary{background:var(--accent);border-radius:999px;padding:13px 24px;font-family:var(--serif);box-shadow:0 2px 0 #9c4a40}
.primary:active{transform:translateY(1px);box-shadow:none}
.chip{background:var(--card);border-color:var(--line);font-family:var(--serif)}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.toggle button.on{background:var(--ink)}
.banner{background:#f6e7c1;border-color:#e4cc86}
label.f input,select{background:var(--card);border-color:var(--line)}
.stars button.on{color:#d7a84a}
/* 옷 만들기 */
.designer{grid-template-columns:minmax(280px,380px) 1fr;gap:22px}
.designer .stagebox{position:sticky;top:12px;border-radius:20px;border:1.5px solid var(--line);box-shadow:0 0 0 5px var(--card),0 0 0 6.5px var(--line);background:var(--card)}
@media (max-width:700px){.designer{grid-template-columns:1fr}.designer .stagebox{position:static;max-width:300px;margin:0 auto}}
.ptabs{gap:8px;margin-bottom:12px}
.ptab{padding:10px 16px;font-size:17px;background:var(--card);border-color:var(--line);display:flex;align-items:center;gap:6px}
.ptab span{font-size:18px}
.ptab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lbl{font-family:var(--serif);font-size:16px;color:var(--ink);margin:14px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.ic2{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:5px 5px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:600}
.ic2 canvas{width:100%;height:auto;aspect-ratio:4/5;border-radius:10px;touch-action:auto}
.ic2.on{border-color:var(--accent);box-shadow:0 0 0 2.5px var(--accent)}
.opts .sw{width:46px;height:46px}
.opts.pats{gap:10px}
.opts button.pt{width:76px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;border-radius:12px}
.pt canvas{width:56px;height:56px;border-radius:8px;touch-action:auto;border:1px solid var(--line)}
.opts button.pt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--card)}
.oc{background:var(--card);border-radius:18px;box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--line)}
.oc .t{font-family:var(--serif)}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
'use strict';
/* ===== 상수 ===== */
const WEATHER={'☀️':'맑음','⛅':'구름 조금','☁️':'흐림','🌧️':'비','❄️':'눈'};
const MOOD={'😊':'기쁨','😐':'보통','😢':'슬픔','😠':'화남','😴':'피곤'};
const STEPS={
 report:[
  {name:'여는 글',short:'여는 글',q:'이 책을 왜 골랐어? 읽기 전에는 어떤 이야기일 것 같았어?',hint:'2~3문장'},
  {name:'이야기 요약',short:'요약',q:'시작, 전환점, 결말 — 세 장면만 골라서 들려줄래?',hint:'줄거리는 짧게, 3~5문장'},
  {name:'마음에 남은 장면',short:'장면',q:'가장 마음에 남은 장면은 어디야? 왜 그랬는지도 알려 줘.',hint:'책에서 마음에 든 문장 한 줄을 옮겨 써도 좋아'},
  {name:'내 생각 넓히기',short:'생각',q:'나라면 어떻게 했을까? 내 경험 중에 닮은 일이 있었어?',hint:'4~6문장'},
  {name:'맺는 글',short:'맺음',q:'이 책이 알려 준 건 뭐야? 작가에게 묻고 싶은 것도 한 줄 남겨 봐.',hint:'2~3문장'}
 ],
 diary:[
  {name:'오늘의 이야기',short:'글',q:'오늘 가장 기억에 남는 건 뭐야? (건너뛰고 그냥 써도 돼)',hint:''}
 ]
};
const TYPE_NAME={report:'독후감',diary:'일기'};
const TYPE_ICON={report:'📖',diary:'📔'};

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function hasInk(step){return step.pages.some(p=>p.length>0);}

/* ===== IndexedDB ===== */
let db=null,entries=[],cur=null,stepIdx=0;
function openDB(){return new Promise((res,rej)=>{
 const r=indexedDB.open('gulbang',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('entries',{keyPath:'id'});
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbAll(){return new Promise((res,rej)=>{const q=db.transaction('entries').objectStore('entries').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
function dbPut(e){return new Promise((res,rej)=>{const t=db.transaction('entries','readwrite');t.objectStore('entries').put(e);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
function dbDel(id){return new Promise((res,rej)=>{const t=db.transaction('entries','readwrite');t.objectStore('entries').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}

/* ===== 글 객체 ===== */
function newEntry(type){
 return {id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,
  date:today(),title:'',author:'',rating:0,weather:'',mood:'',
  created:Date.now(),updated:Date.now(),done:false,
  steps:STEPS[type].map(()=>({mode:'key',text:'',pages:[[]]}))};
}
let saveTimer=null;
function touch(){
 if(!cur)return;
 cur.updated=Date.now();
 const s=$('#saved');if(s)s.textContent='저장 중…';
 clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);
}
async function flush(){
 if(!cur)return;
 clearTimeout(saveTimer);
 try{
  await dbPut(cur);
  if(!entries.includes(cur)&&!entries.some(e=>e.id===cur.id))entries.push(cur);
  const s=$('#saved');if(s)s.textContent='저장됨 ✓';
 }catch(err){const s=$('#saved');if(s)s.textContent='⚠️ 저장 실패';}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});

/* ===== 옷 (1920년대 패션 플레이트 스타일) ===== */
const COLORS=[['#b23a48','딸기'],['#d1604a','산호'],['#e9aaa3','연분홍'],['#d7a84a','겨자'],['#f3ead2','크림'],['#8fbfae','민트'],['#2f8d82','청록'],['#4272b3','파랑'],['#27426e','남색'],['#7d5a9b','보라'],['#52392f','갈색'],['#2b2a33','검정']];
const HAIRS=[['#2a2220','검정'],['#4a3126','짙은 갈색'],['#7a4b2e','밤색'],['#b9783c','구릿빛'],['#dcb96e','금발'],['#9a3b2c','적갈색']];
const SKINS=[['#f4d9c3','밝은 살구'],['#ecc4a2','살구'],['#d4a07a','황갈'],['#a97650','구리'],['#7b4f36','진한 갈색']];
const PARTS=[
 {k:'me',name:'모델',pat:false,palette:HAIRS,colorLabel:'머리 색',skins:true,styles:[['bob','단발'],['bun','올림머리'],['long','긴 머리']]},
 {k:'top',name:'상의',pat:true,styles:[['tee','반팔 블라우스'],['long','긴팔 블라우스'],['vest','민소매']]},
 {k:'bottom',name:'하의',pat:true,styles:[['skirt','플레어 치마'],['long','롱 드레스'],['pants','와이드 팬츠'],['shorts','반바지']]},
 {k:'cape',name:'망토',pat:true,styles:[['none','없음'],['short','어깨 망토'],['long','긴 코트 망토']]},
 {k:'hat',name:'모자',pat:false,styles:[['none','없음'],['beret','클로슈 모자'],['cap','챙 넓은 모자'],['crown','머리띠'],['bow','머리 리본']]},
 {k:'acc',name:'소품',pat:false,styles:[['none','없음'],['scarf','진주 목걸이'],['bag','손가방'],['badge','장미 코르사주'],['tie','리본 칼라'],['gloves','긴 장갑'],['umbrella','양산']]},
 {k:'scene',name:'배경',pat:false,nocolor:true,styles:[['cloud','구름 하늘'],['pink','분홍 노을'],['garden','나무와 들판'],['paper','종이 배경']]}
];
const PATS=[['none','무늬 없음'],['lines','굵은 줄무늬'],['dot','물방울'],['floral','꽃무늬'],['paisley','페이즐리'],['check','체크'],['zig','지그재그']];
const PAT_IDS=['lines','dot','floral','paisley','check','zig'];
const LN='#3a2a22',INK='#241c1a';
function newOutfit(){
 return {note:'',skin:SKINS[0][0],parts:{
  me:{style:'bob',color:HAIRS[0][0],pattern:'none'},
  top:{style:'long',color:'#f3ead2',pattern:'none'},
  bottom:{style:'long',color:'#2f8d82',pattern:'none'},
  cape:{style:'none',color:'#b23a48',pattern:'none'},
  hat:{style:'none',color:'#8fbfae',pattern:'none'},
  acc:{style:'none',color:'#f3ead2',pattern:'none'},
  scene:{style:'cloud',color:'#ffffff',pattern:'none'}}};
}
function rgb(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function mix(h,t,a){const A=rgb(h),B=rgb(t);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*a).toString(16).padStart(2,'0')).join('');}
const lighten=(h,a)=>mix(h,'#ffffff',a),darken=(h,a)=>mix(h,'#000000',a);
function lum(hex){const c=rgb(hex);return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255;}
const n1=v=>(Math.round(v*10)/10);

/* 종이 질감: 한 번만 만들어 모든 그림이 함께 씀 */
function ensureGrain(){
 if(typeof document==='undefined'||document.getElementById('gb-grain-svg'))return;
 try{
  const c=document.createElement('canvas');c.width=c.height=160;
  const x=c.getContext('2d'),im=x.createImageData(160,160);
  for(let i=0;i<im.data.length;i+=4){im.data[i]=96;im.data[i+1]=76;im.data[i+2]=58;im.data[i+3]=Math.random()*Math.random()*34;}
  x.putImageData(im,0,0);
  const d=document.createElement('div');

/* 부드러운 곡선 팔다리 */
function catmull(pts,n){
 const out=[],P=[pts[0]].concat(pts,[pts[pts.length-1]]);
 for(let i=1;i<P.length-2;i++){
  const a=P[i-1],b=P[i],c=P[i+1],d=P[i+2];
  for(let j=0;j<n;j++){
   const t=j/n,t2=t*t,t3=t2*t;
   out.push([0.5*(2*b[0]+(-a[0]+c[0])*t+(2*a[0]-5*b[0]+4*c[0]-d[0])*t2+(-a[0]+3*b[0]-3*c[0]+d[0])*t3),
             0.5*(2*b[1]+(-a[1]+c[1])*t+(2*a[1]-5*b[1]+4*c[1]-d[1])*t2+(-a[1]+3*b[1]-3*c[1]+d[1])*t3)]);
  }
 }
 out.push(pts[pts.length-1]);
 return out;
}
function limb(ctrl,widths,t0,t1,grow){
 const S=catmull(ctrl,8),n=S.length;
 const wAt=i=>{const f=i/(n-1)*(widths.length-1),k=Math.min(Math.floor(f),widths.length-2),r=f-k;return widths[k]*(1-r)+widths[k+1]*r+(grow||0);};
 const i0=Math.round(t0*(n-1)),i1=Math.round(t1*(n-1)),L=[],R=[];
 for(let i=i0;i<=i1;i++){
  const a=S[Math.max(i-1,0)],b=S[Math.min(i+1,n-1)];
  let dx=b[0]-a[0],dy=b[1]-a[1];const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
  const w=wAt(i);
  L.push([S[i][0]-dy*w,S[i][1]+dx*w]);R.push([S[i][0]+dy*w,S[i][1]-dx*w]);
 }
 const f=p=>n1(p[0])+' '+n1(p[1]);
 return 'M'+L.map(f).join('L')+'L'+R.reverse().map(f).join('L')+'Z';
}

function tileFor(kind,col){
 const dark=lum(col)>0.55,ink=dark?darken(col,0.28):lighten(col,0.35);
 const S=kind==='check'?64:kind==='lines'?40:kind==='zig'?48:60;
 const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
 x.fillStyle=col;x.fillRect(0,0,S,S);x.fillStyle=ink;x.strokeStyle=ink;
 if(kind==='lines'){x.fillRect(0,S*0.35,S,S*0.28);}
 else if(kind==='dot'){[[S*.25,S*.25],[S*.75,S*.75]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,S*.11,0,7);x.fill();});}
 else if(kind==='floral'){[[S*.27,S*.27],[S*.77,S*.7]].forEach(([a,b])=>{for(let k=0;k<5;k++){const t=k*Math.PI*2/5;x.beginPath();x.arc(a+Math.cos(t)*S*.08,b+Math.sin(t)*S*.08,S*.06,0,7);x.fill();}x.fillStyle=dark?lighten(col,.6):darken(col,.5);x.beginPath();x.arc(a,b,S*.03,0,7);x.fill();x.fillStyle=ink;});}
 else if(kind==='check'){x.fillRect(0,0,S/2,S/2);x.fillRect(S/2,S/2,S/2,S/2);}
 else if(kind==='zig'){x.lineWidth=S*.1;x.beginPath();for(let i=0;i<=4;i++){const px=i*S/4,py=i%2?S*.35:S*.65;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();}
 return c;
}
async function paintOutfit(cv,o){
 cv.width=IW;cv.height=IH;const x=cv.getContext('2d');
 const P=o.parts,order=[['scene'],['base'],['bottom'],['top'],['cape'],['acc','pearls'],['acc','gloves'],['hat'],['acc','bag'],['acc','parasol']];
 const jobs=[];
 for(const [k,sub] of order){
  if(k==='base'){jobs.push({f:'base.webp'});continue;}
  const p=P[k],g=G[k];
  if(k==='acc'){if(!p.ids.includes(sub))continue;jobs.push({f:g.file[sub],tint:sub==='pearls'?null:p});continue;}
  if(!p.id||p.id==='none')continue;
  jobs.push({f:g.file[p.id],tint:k==='scene'?null:p});
 }
 const imgs=await Promise.all(jobs.map(j=>loadImg(j.f)));
 x.clearRect(0,0,IW,IH);x.fillStyle='#f6efdc';x.fillRect(0,0,IW,IH);
 const t=document.createElement('canvas');t.width=IW;t.height=IH;const tx=t.getContext('2d');
 jobs.forEach((j,i)=>{
  const im=imgs[i];if(!im)return;
  if(!j.tint||j.tint.color==='#f3ead2'&&j.tint.pattern==='none'){x.drawImage(im,0,0,IW,IH);return;}
  tx.globalCompositeOperation='source-over';tx.clearRect(0,0,IW,IH);tx.drawImage(im,0,0,IW,IH);
  tx.globalCompositeOperation='multiply';
  if(j.tint.pattern&&j.tint.pattern!=='none'){tx.fillStyle=tx.createPattern(tileFor(j.tint.pattern,j.tint.color),'repeat');}
  else tx.fillStyle=j.tint.color;
  tx.fillRect(0,0,IW,IH);
  tx.globalCompositeOperation='destination-in';tx.drawImage(im,0,0,IW,IH);
  tx.globalCompositeOperation='source-over';x.drawImage(t,0,0);
 });
}

const PW=1000,PH=700;
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function wid(st,pr,s){return st.w*(0.6+0.8*pr)*s;}
function seg2(c,s,st,a,b,pr){ // a→b 직선
 c.strokeStyle=st.c;c.lineWidth=wid(st,pr,s);c.beginPath();c.moveTo(a[0]*s,a[1]*s);c.lineTo(b[0]*s,b[1]*s);c.stroke();
}
function curve(c,s,st,p0,p1,p2){ // p1을 지나가는 부드러운 곡선 (p0-p1, p1-p2 중간점 사이)
 const m1=mid(p0,p1),m2=mid(p1,p2);
 c.strokeStyle=st.c;c.lineWidth=wid(st,p1[2],s);c.beginPath();c.moveTo(m1[0]*s,m1[1]*s);c.quadraticCurveTo(p1[0]*s,p1[1]*s,m2[0]*s,m2[1]*s);c.stroke();
}
function drawStrokes(c,s,strokes){
 c.lineCap='round';c.lineJoin='round';
 for(const st of strokes){
  const p=st.pts,n=p.length;
  if(n===1){c.fillStyle=st.c;c.beginPath();c.arc(p[0][0]*s,p[0][1]*s,wid(st,p[0][2],s)/2,0,Math.PI*2);c.fill();continue;}
  seg2(c,s,st,p[0],mid(p[0],p[1]),p[0][2]);
  for(let i=1;i<n-1;i++)curve(c,s,st,p[i-1],p[i],p[i+1]);
  seg2(c,s,st,mid(p[n-2],p[n-1]),p[n-1],p[n-1][2]);
 }
}
function drawRules(c,s){
 c.strokeStyle='#dde6ee';c.lineWidth=1*s;
 for(let y=70;y<PH;y+=70){c.beginPath();c.moveTo(30*s,y*s);c.lineTo((PW-30)*s,y*s);c.stroke();}
}
function pageImg(strokes){
 if(!strokes.length)return '';
 const c=document.createElement('canvas');c.width=PW;c.height=PH;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);drawRules(x,1);drawStrokes(x,1,strokes);
 return c.toDataURL('image/png');
}

 function size(){
  const w=cv.parentElement.clientWidth,dpr=window.devicePixelRatio||1;
  cv.style.width=w+'px';cv.style.height=(w*PH/PW)+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*PH/PW*dpr);redraw();
 }
 onResize=size;
 const pt=e=>{
  const r=cv.getBoundingClientRect();
  const pr=(e.pointerType==='pen'&&e.pressure>0)?e.pressure:0.5;
  return [Math.round((e.clientX-r.left)/r.width*PW*10)/10,Math.round((e.clientY-r.top)/r.height*PH*10)/10,Math.round(pr*100)/100];
 };
 function erase(p){
  const R=26,before=page().length;
  step.pages[pi]=page().filter(st=>!st.pts.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<R));
  if(page().length!==before){erased=true;redraw();}
 }
 let aid=null; // 지금 쓰고 있는 손가락/펜 하나만 따라간다 (손바닥이 끼어들지 못하게)
 try{if(localStorage.getItem('gulbang_pen')==='1')penSeen=true;}catch(_){}
 const cancelStroke=()=>{if(drawing&&!drawing.erase){const i=page().indexOf(drawing);if(i>=0)page().splice(i,1);redraw();}drawing=null;aid=null;};
 cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen'&&!penSeen){penSeen=true;try{localStorage.setItem('gulbang_pen','1');}catch(_){}}
  if(e.pointerType==='touch'&&penSeen)return; // 펜을 쓰는 중이면 손바닥·손가락 무시
  if(aid!==null){ if(e.pointerType==='pen')cancelStroke(); else return; }
  e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}aid=e.pointerId;
  const p=pt(e);
  if(tool==='eraser'){drawing={erase:true};erased=false;erase(p);}
  else{
   const st={c:color,w:4,pts:[p]};page().push(st);drawing=st;
   ctx.lineCap='round';ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0]*scale(),p[1]*scale(),wid(st,p[2],scale())/2,0,Math.PI*2);ctx.fill();
  }
 });
 cv.addEventListener('pointermove',e=>{
  if(!drawing||e.pointerId!==aid)return;
  e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){
   const p=pt(ev);
   if(drawing.erase){erase(p);continue;}
   const q=drawing.pts,l=q[q.length-1];
   if(Math.hypot(p[0]-l[0],p[1]-l[1])<0.8)continue; // 너무 가까운 점은 버림
   q.push(p);
   ctx.lineCap='round';ctx.lineJoin='round';
   const n=q.length;
   if(n===2)seg2(ctx,scale(),drawing,q[0],mid(q[0],q[1]),q[0][2]);
   else curve(ctx,scale(),drawing,q[n-3],q[n-2],q[n-1]);
  }
 });
 const end=e=>{
  if(!drawing||(e&&e.pointerId!==aid))return;
  const wasErase=drawing.erase;drawing=null;aid=null;
  if(!wasErase)redraw(); // 끝까지 매끄럽게 다시 그리기
  if(!wasErase||erased)onChange();
 };
 cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 ['touchstart','touchmove'].forEach(t=>cv.addEventListener(t,e=>e.preventDefault(),{passive:false}));
 ['gesturestart','contextmenu','selectstart'].forEach(t=>cv.addEventListener(t,e=>e.preventDefault()));
 box.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){tool=b.dataset.t;box.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));}
  else if(b.dataset.c){color=b.dataset.c;tool='pen';box.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));box.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t==='pen'));}
  else if(b.id==='undo'){if(page().length){page().pop();redraw();onChange();}}
  else if(b.id==='clr'){if(page().length&&confirm('이 쪽의 글씨를 모두 지울까요?')){step.pages[pi]=[];redraw();onChange();}}
  else if(b.id==='pp'){if(pi>0){pi--;redraw();}}
  else if(b.id==='pn'){if(pi<step.pages.length-1){pi++;redraw();}}
  else if(b.id==='pa'){step.pages.push([]);pi=step.pages.length-1;redraw();onChange();}
 });
 size();
}

/* ===== 홈 ===== */
function lastBackupDays(){
 const t=+localStorage.getItem('gulbang_lastBackup')||0;
 return t?Math.floor((Date.now()-t)/86400000):null;
}
function preview(e){
 for(const s of e.steps){if(s.text.trim())return s.text.trim().replace(/\s+/g,' ').slice(0,46);}
 return e.steps.some(hasInk)?'✏️ 손글씨로 쓴 글':'(아직 비어 있어요)';
}
function renderHome(){
 cur=null;onResize=null;
 const list=[...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.updated-a.updated);
 const d=lastBackupDays();
 const banner=(entries.length&&(d===null||d>=30))
  ?`<div class="banner"><span>💾 ${d===null?'아직 백업한 적이 없어요.':d+'일 전에 백업했어요.'} 소중한 글이라 한 달에 한 번은 백업해 두자.</span><button class="ghost" id="goBackup">백업하기</button></div>`:'';
 app.innerHTML=`<div class="wrap">
  <div class="hero"><canvas id="hero"></canvas><div><h1>진윤이의 글방</h1><p class="tag">읽고, 쓰고, 옷도 짓는<br>나만의 작은 방</p><div class="orn">❦</div></div></div>${banner}
  <div class="big">
   <button data-new="report">📖<b>독후감 쓰기</b></button>
   <button data-new="diary">📔<b>일기 쓰기</b></button>
  </div>
  <div class="row"><h2>내 글 (${list.length})</h2><span style="display:flex;gap:8px"><button class="ghost" id="toCloset">👗 옷장 (${entries.filter(e=>e.outfit).length})</button><button class="ghost" id="toExport">내보내기 · 백업</button></span></div>
  <ul class="list">${list.map(e=>`<li>
   <button class="item" data-open="${e.id}"><span class="ic">${TYPE_ICON[e.type]}</span><span><div class="t">${esc(e.title||(e.type==='diary'?e.date+' 일기':'(제목 없음)'))}${e.done?' ✅':''}${e.outfit?' 👗':''}</div><div class="s">${TYPE_NAME[e.type]} · ${e.date} · ${esc(preview(e))}</div></span></button>
   <button class="del" data-del="${e.id}" aria-label="삭제">🗑</button></li>`).join('')||'<li style="color:var(--sub)">아직 쓴 글이 없어요. 위 버튼으로 시작해 보자!</li>'}</ul>
 <div class="ver">진윤이의 글방 v0.6</div>
 </div>`;
 app.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{cur=newEntry(b.dataset.new);stepIdx=0;renderEditor();});
 app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{cur=entries.find(e=>e.id===b.dataset.open);stepIdx=0;renderEditor();});
 app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
  if(!confirm('이 글을 지울까요? 되돌릴 수 없어요.'))return;
  await dbDel(b.dataset.del);entries=entries.filter(e=>e.id!==b.dataset.del);renderHome();
 });
 $('#toExport').onclick=renderExport;
 $('#toCloset').onclick=renderCloset;
 paintOutfit($('#hero'),HERO);
 const g=$('#goBackup');if(g)g.onclick=renderExport;
}

/* ===== 편집 ===== */
function renderEditor(){
 const defs=STEPS[cur.type];
 const chipLabels=[cur.type==='report'?'책 정보':'오늘',...defs.map((d,i)=>cur.type==='report'?`${i+1} ${d.short}`:d.short)];
 app.innerHTML=`<div class="wrap">
  <header class="bar"><button class="ghost" id="back">← 목록</button><span><span id="saved"></span> <button class="ghost" id="toOutfit">👗 옷</button></span></header>
  <nav class="chips">${chipLabels.map((l,i)=>`<button class="chip" data-i="${i}">${esc(l)}</button>`).join('')}</nav>
  <main id="stage"></main>
  <footer class="nav"><button class="ghost" id="prev">← 이전</button><button class="primary" id="next"></button></footer>
 </div>`;
 $('#back').onclick=async()=>{await flush();renderHome();};
 $('#toOutfit').onclick=async()=>{await flush();dPart='top';renderDesigner(cur);};
 app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(+c.dataset.i));
 $('#prev').onclick=()=>go(stepIdx-1);
 $('#next').onclick=async()=>{
  if(stepIdx<defs.length){go(stepIdx+1);}
  else{cur.done=true;touch();await flush();
   if(cur.outfit){renderHome();toast('다 썼어요! 수고했어 🎉');}
   else{dPart='top';renderDesigner(cur);toast('다 썼어요! 이제 옷을 만들어 보자 🎉');}}
 };
 go(stepIdx);
}
function go(i){
 const defs=STEPS[cur.type];
 stepIdx=Math.max(0,Math.min(defs.length,i));
 app.querySelectorAll('.chip').forEach((c,k)=>c.classList.toggle('on',k===stepIdx));
 const act=app.querySelector('.chip.on');if(act&&act.scrollIntoView)act.scrollIntoView({block:'nearest',inline:'center'});
 $('#prev').style.visibility=stepIdx===0?'hidden':'visible';
 $('#next').textContent=stepIdx===defs.length?'다 썼어요 🎉':'다음 →';
 onResize=null;
 if(stepIdx===0)renderMeta();else renderStep(stepIdx-1);
 window.scrollTo(0,0);
}
function renderMeta(){
 const st=$('#stage');
 if(cur.type==='report'){
  st.innerHTML=`
   <label class="f">책 제목<input id="f-title" value="${esc(cur.title)}" placeholder="읽은 책 제목"></label>
   <label class="f">지은이<input id="f-author" value="${esc(cur.author)}" placeholder="글쓴이"></label>
   <label class="f">읽은 날<input type="date" id="f-date" value="${esc(cur.date)}"></label>
   <div class="f" style="color:var(--sub);font-size:15px">별점 (다 쓴 뒤에 줘도 돼)</div>
   <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${n<=cur.rating?'on':''}">★</button>`).join('')}</div>`;
  $('#f-title').oninput=e=>{cur.title=e.target.value;touch();};
  $('#f-author').oninput=e=>{cur.author=e.target.value;touch();};
  $('#f-date').oninput=e=>{cur.date=e.target.value||today();touch();};
  $('#stars').onclick=e=>{
   const b=e.target.closest('button');if(!b)return;
   const n=+b.dataset.n;cur.rating=(cur.rating===n)?0:n;touch();
   $('#stars').querySelectorAll('button').forEach((x,k)=>x.classList.toggle('on',k<cur.rating));
  };
 }else{
  const pick=(map,key)=>`<div class="pick" data-k="${key}">${Object.keys(map).map(k=>`<button data-v="${k}" class="${cur[key]===k?'on':''}" aria-label="${map[k]}">${k}</button>`).join('')}</div>`;
  st.innerHTML=`
   <label class="f">날짜<input type="date" id="f-date" value="${esc(cur.date)}"></label>
   <div class="f" style="color:var(--sub);font-size:15px">오늘 날씨</div>${pick(WEATHER,'weather')}
   <div class="f" style="color:var(--sub);font-size:15px;margin-top:14px">오늘 기분</div>${pick(MOOD,'mood')}
   <label class="f" style="margin-top:14px">제목 (없어도 돼요)<input id="f-title" value="${esc(cur.title)}" placeholder="오늘 하루를 한마디로"></label>`;
  $('#f-date').oninput=e=>{cur.date=e.target.value||today();touch();};
  $('#f-title').oninput=e=>{cur.title=e.target.value;touch();};
  st.querySelectorAll('.pick').forEach(p=>p.onclick=e=>{
   const b=e.target.closest('button');if(!b)return;
   const key=p.dataset.k;cur[key]=(cur[key]===b.dataset.v)?'':b.dataset.v;touch();
   p.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===cur[key]));
  });
 }
}
function renderStep(k){
 const def=STEPS[cur.type][k],step=cur.steps[k],st=$('#stage');
 st.innerHTML=`
  <div class="bubble"><span class="ic">💬</span><div><b>${esc(def.name)}</b><p>${esc(def.q)}</p>${def.hint?`<small>${esc(def.hint)}</small>`:''}</div></div>
  <div class="toggle"><button data-m="pen">✏️ 펜으로 쓰기</button><button data-m="key">⌨️ 키보드로 쓰기</button></div>
  <div id="inp"></div>`;
 const setMode=m=>{
  step.mode=m;
  st.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const box=$('#inp');onResize=null;
  if(m==='key'){
   box.innerHTML=`<textarea class="body" id="ta" placeholder="여기에 써 봐">${esc(step.text)}</textarea><small id="cnt" style="color:var(--sub)"></small>`;
   const ta=$('#ta'),cnt=$('#cnt');
   const upd=()=>{cnt.textContent=ta.value.length+'자';};upd();
   ta.oninput=()=>{step.text=ta.value;upd();touch();};
  }else{
   box.innerHTML=`<div id="penbox"></div>
    <details><summary>글자로 옮기기 (책으로 엮을 때 쓰는 칸)</summary>
     <textarea id="tv" placeholder="손글씨를 글자로 옮겨 적어 두면 책 원고로 쓸 수 있어요">${esc(step.text)}</textarea></details>`;
   mountPen($('#penbox'),step,touch);
   $('#tv').oninput=e=>{step.text=e.target.value;touch();};
  }
 };
 st.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);touch();});
 setMode(step.mode||'key');
}

/* ===== 내보내기 ===== */
function download(name,text,type){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function stamp(){return today().replace(/-/g,'');}
function toMd(list){
 return list.map(e=>{
  const defs=STEPS[e.type];
  let h;
  if(e.type==='report'){
   h=`# ${e.title||'(제목 없음)'}${e.author?' — '+e.author:''}\n\n- 종류: 독후감\n- 날짜: ${e.date}\n`+(e.rating?`- 별점: ${'★'.repeat(e.rating)}${'☆'.repeat(5-e.rating)}\n`:'');
  }else{
   h=`# ${e.date} 일기${e.title?' — '+e.title:''}\n\n- 종류: 일기\n`+(e.weather?`- 날씨: ${WEATHER[e.weather]||e.weather}\n`:'')+(e.mood?`- 기분: ${MOOD[e.mood]||e.mood}\n`:'');
  }
  const body=e.steps.map((s,i)=>{
   const t=s.text.trim()||(hasInk(s)?'(손글씨로 씀 — 글자로 옮겨지지 않음)':'');
   if(!t)return '';
   return e.type==='report'?`\n## ${i+1}. ${defs[i].name}\n\n${t}\n`:`\n${t}\n`;
  }).join('');
  const ot=(e.outfit&&e.outfit.note.trim())?`\n## 옷 이야기\n\n${e.outfit.note.trim()}\n`:'';
  return h+body+ot;
 }).join('\n\n---\n\n');
}
function buildPrint(list){
 return list.map(e=>{
  const defs=STEPS[e.type];
  const head=e.type==='report'
   ?`<h1>${esc(e.title||'(제목 없음)')}</h1><div class="meta">독후감${e.author?' · '+esc(e.author):''} · ${esc(e.date)}${e.rating?' · '+'★'.repeat(e.rating)+'☆'.repeat(5-e.rating):''}</div>`
   :`<h1>${esc(e.date)} ${e.weather||''} ${e.mood||''}</h1><div class="meta">일기${e.title?' · '+esc(e.title):''}</div>`;
  const body=e.steps.map((s,i)=>{
   const imgs=s.pages.map(pageImg).filter(Boolean).map(u=>`<img src="${u}" alt="">`).join('');
   const txt=s.text.trim()?`<p>${esc(s.text.trim()).replace(/\n/g,'<br>')}</p>`:'';
   if(!imgs&&!txt)return '';
   return (e.type==='report'?`<h3>${i+1}. ${esc(defs[i].name)}</h3>`:'')+imgs+(imgs&&txt?'':'')+txt;
  }).join('');
  const ob=e.outfit?`<div style="text-align:center;page-break-inside:avoid;margin-top:14pt"><div style="width:46mm;margin:0 auto">${e.outfit.v===2?`<img src="${OURL.get(e.id)||''}" style="width:100%">`:outfitSVG(e.outfit)}</div>${e.outfit.note.trim()?`<p>${esc(e.outfit.note.trim())}</p>`:''}</div>`:'';
  return `<section class="pe">${head}${body}${ob}</section>`;
 }).join('');
}
function renderExport(){
 cur=null;onResize=null;
 app.innerHTML=`<div class="wrap">
  <header class="bar"><button class="ghost" id="back">← 목록</button></header>
  <h1>내보내기 · 백업</h1>
  <div class="card"><h2>어떤 글을 내보낼까?</h2>
   <label class="f">종류<select id="x-type"><option value="all">독후감 + 일기</option><option value="report">독후감만</option><option value="diary">일기만</option></select></label>
   <div class="two"><label class="f">부터<input type="date" id="x-from"></label><label class="f">까지<input type="date" id="x-to"></label></div>
   <div id="x-count" style="color:var(--sub)"></div>
   <div class="btns">
    <button class="primary" id="x-md">글만 저장 (.md)</button>
    <button class="primary" id="x-pdf">PDF로 인쇄 (손글씨 포함)</button>
   </div>
   <p style="font-size:14px;color:var(--sub)">글만 저장은 키보드로 쓴 글과 &quot;글자로 옮기기&quot;에 적은 글이 들어가요. PDF는 인쇄 창에서 &quot;PDF로 저장&quot;을 고르면 돼요.</p>
  </div>
  <div class="card"><h2>전체 백업</h2>
   <p style="margin:0;font-size:15px;color:var(--sub)">손글씨까지 전부 담아서 나중에 복원할 수 있어요. 모든 글이 들어가요(위 조건과 무관).</p>
   <div class="btns"><button class="ghost" id="x-json">백업 파일 저장 (.json)</button><button class="ghost" id="x-imp">백업 불러오기</button></div>
   <input type="file" id="x-file" accept=".json,application/json" hidden>
  </div></div>`;
 const filtered=()=>{
  const t=$('#x-type').value,f=$('#x-from').value,to=$('#x-to').value;
  return entries.filter(e=>(t==='all'||e.type===t)&&(!f||e.date>=f)&&(!to||e.date<=to)).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
 };
 const cnt=()=>{$('#x-count').textContent=`내보낼 글: ${filtered().length}편`;};
 ['x-type','x-from','x-to'].forEach(id=>$('#'+id).onchange=cnt);cnt();
 $('#back').onclick=renderHome;
 $('#x-md').onclick=()=>{const l=filtered();if(!l.length)return toast('내보낼 글이 없어요');download(`글방_${stamp()}.md`,toMd(l),'text/markdown');};
 $('#x-pdf').onclick=async()=>{
  const l=filtered();if(!l.length)return toast('내보낼 글이 없어요');
  for(const e of l)if(e.outfit&&e.outfit.v===2)await outfitURL(e);
  $('#print').innerHTML=buildPrint(l);
  window.onafterprint=()=>{$('#print').innerHTML='';window.onafterprint=null;};
  setTimeout(()=>window.print(),150);
 };
 $('#x-json').onclick=()=>{
  download(`글방_백업_${stamp()}.json`,JSON.stringify({app:'gulbang',version:1,exported:new Date().toISOString(),entries}),'application/json');
  localStorage.setItem('gulbang_lastBackup',String(Date.now()));toast('백업 파일을 만들었어요 💾');
 };
 $('#x-imp').onclick=()=>$('#x-file').click();
 $('#x-file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const j=JSON.parse(await f.text());
   if(j.app!=='gulbang'||!Array.isArray(j.entries))throw new Error('형식');
   let n=0;
   for(const it of j.entries){
    const old=entries.find(x=>x.id===it.id);
    if(!old||(it.updated||0)>(old.updated||0)){await dbPut(it);n++;}
   }
   entries=await dbAll();toast(`${n}편을 불러왔어요`);renderExport();
  }catch(err){alert('백업 파일을 읽지 못했어요. 이 앱에서 만든 .json 파일인지 확인해 줘.');}
  e.target.value='';
 };
}
